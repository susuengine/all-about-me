<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All About Me — Color & Fill</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: #f0ebe3;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px 40px;
  }

  h1 {
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    font-size: 28px;
    color: #3a2a1a;
    margin-bottom: 14px;
    letter-spacing: 1px;
    text-align: center;
  }

  /* ─── TOOLBAR ─── */
  #toolbar {
    background: #fff;
    border: 2px solid #d6c9b8;
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    max-width: 900px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .tb-label {
    font-size: 12px;
    color: #888;
    white-space: nowrap;
  }
  .swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.12s;
    flex-shrink: 0;
  }
  .swatch:hover { transform: scale(1.18); }
  .swatch.active { border-color: #333; transform: scale(1.22); box-shadow: 0 0 0 1px #fff inset; }
  .sep { width: 1px; height: 24px; background: #e0d8ce; margin: 0 2px; flex-shrink: 0; }
  .tb-btn {
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    font-size: 13px;
    padding: 5px 11px;
    border-radius: 8px;
    border: 1.5px solid #ccc;
    background: #fafafa;
    cursor: pointer;
    color: #333;
    transition: background 0.12s, border-color 0.12s;
    white-space: nowrap;
  }
  .tb-btn:hover { background: #f0ebe3; border-color: #bbb; }
  .tb-btn.active { background: #e8f4fd; border-color: #5b9bd5; color: #1a5fa8; }
  .size-wrap { display: flex; align-items: center; gap: 5px; }
  input[type=range] {
    width: 80px; cursor: pointer; accent-color: #5b9bd5;
  }
  #size-val { font-size: 12px; color: #666; min-width: 18px; }

  .tb-btn.export {
    background: #3a2a1a;
    color: #fff;
    border-color: #3a2a1a;
    font-weight: 600;
    margin-left: auto;
    padding: 5px 16px;
  }
  .tb-btn.export:hover { background: #5a3a22; }

  /* ─── WORKSHEET CONTAINER ─── */
  #ws-wrap {
    position: relative;
    width: 100%;
    max-width: 860px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    cursor: crosshair;
    touch-action: none;
  }

  /* bg image layer */
  #bg-img {
    display: block;
    width: 100%;
    height: auto;
    position: relative;
    z-index: 1;
    pointer-events: none;
    user-select: none;
  }

  /* drawing canvas — sits above bg, below lines */
  #draw-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }

  /* line-art overlay — always on top */
  #lines-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
    pointer-events: none;
    user-select: none;
  }

  /* text inputs layer */
  #text-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 4;
    pointer-events: none;
  }
  .field-wrap {
    position: absolute;
    pointer-events: all;
  }
  .field-wrap input {
    width: 100%;
    border: none;
    border-bottom: 2px dashed rgba(80,80,200,0.35);
    background: transparent;
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    color: #1a1a8a;
    outline: none;
    padding: 1px 2px;
    text-align: center;
    display: block;
  }
  .field-wrap input::placeholder { color: rgba(100,100,180,0.4); }
  .field-wrap input:focus { border-bottom-color: rgba(80,80,200,0.7); background: rgba(255,255,255,0.45); border-radius: 3px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #3a2a1a; color: #fff;
    padding: 10px 22px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 999;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>✏️ All About Me — Color &amp; Fill In!</h1>

<div id="toolbar">
  <span class="tb-label">Color:</span>
  <div id="swatches" style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;"></div>
  <div class="sep"></div>
  <div class="size-wrap">
    <span class="tb-label">Size:</span>
    <input type="range" id="brush-size" min="2" max="40" value="12" step="1">
    <span id="size-val">12</span>
  </div>
  <div class="sep"></div>
  <button class="tb-btn active" id="btn-brush">🖌 Brush</button>
  <button class="tb-btn" id="btn-fill">🪣 Fill</button>
  <button class="tb-btn" id="btn-eraser">⬜ Eraser</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-undo">↩ Undo</button>
  <button class="tb-btn" id="btn-clear">✕ Clear all</button>
  <button class="tb-btn export" id="btn-export">⬇ Download</button>
</div>

<script>
const IMG_W = 1241;
const IMG_H = 1654;

// ─── COLOR PALETTE ───
const COLORS = [
  '#e63946','#f4842c','#f9c74f','#90be6d','#43aa8b','#4cc9f0','#4361ee','#7209b7',
  '#f72585','#a0522d','#000000','#ffffff'
];
let currentColor = COLORS[0];
let mode = 'brush'; // brush | fill | eraser
let brushSize = 12;
let history = [];
const MAX_HISTORY = 30;

// Build swatches
const swatchContainer = document.getElementById('swatches');
COLORS.forEach(c => {
  const s = document.createElement('div');
  s.className = 'swatch' + (c === currentColor ? ' active' : '');
  s.style.background = c;
  if (c === '#ffffff') s.style.boxShadow = 'inset 0 0 0 1px #ccc';
  s.onclick = () => {
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    currentColor = c;
    if (mode === 'eraser') setMode('brush');
  };
  swatchContainer.appendChild(s);
});

function setMode(m) {
  mode = m;
  document.getElementById('btn-brush').classList.toggle('active', m==='brush');
  document.getElementById('btn-fill').classList.toggle('active', m==='fill');
  document.getElementById('btn-eraser').classList.toggle('active', m==='eraser');
  wsWrap.style.cursor = m === 'fill' ? 'cell' : 'crosshair';
}
document.getElementById('btn-brush').onclick = () => setMode('brush');
document.getElementById('btn-fill').onclick = () => setMode('fill');
document.getElementById('btn-eraser').onclick = () => setMode('eraser');

const sizeInput = document.getElementById('brush-size');
const sizeVal = document.getElementById('size-val');
sizeInput.addEventListener('input', () => {
  brushSize = +sizeInput.value;
  sizeVal.textContent = brushSize;
});

// ─── CANVAS SETUP ───
const wsWrap = document.getElementById('ws-wrap');
const bgImg = document.getElementById('bg-img');
const drawCanvas = document.getElementById('draw-canvas');
const ctx = drawCanvas.getContext('2d');

function resizeCanvas() {
  const rect = bgImg.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  drawCanvas.width = rect.width * dpr;
  drawCanvas.height = rect.height * dpr;
  drawCanvas.style.width = rect.width + 'px';
  drawCanvas.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);
  redrawHistory();
}

bgImg.onload = resizeCanvas;
if (bgImg.complete) resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function getCanvasPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  const dpr = window.devicePixelRatio || 1;
  return {
    x: (src.clientX - rect.left),
    y: (src.clientY - rect.top)
  };
}

// ─── DRAWING ───
let drawing = false, lastX, lastY;
let currentStroke = null; // for undo: store each stroke

function saveHistory() {
  const dpr = window.devicePixelRatio || 1;
  const snap = ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
  history.push(snap);
  if (history.length > MAX_HISTORY) history.shift();
}

function redrawHistory() {
  ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  if (history.length > 0) {
    ctx.putImageData(history[history.length-1], 0, 0);
  }
}

wsWrap.addEventListener('mousedown', onStart);
wsWrap.addEventListener('mousemove', onMove);
wsWrap.addEventListener('mouseup', onEnd);
wsWrap.addEventListener('mouseleave', onEnd);
wsWrap.addEventListener('touchstart', onStart, {passive:false});
wsWrap.addEventListener('touchmove', onMove, {passive:false});
wsWrap.addEventListener('touchend', onEnd);

function onStart(e) {
  // Don't draw if clicking on a text input
  if (e.target.tagName === 'INPUT') return;
  e.preventDefault();
  const pos = getCanvasPos(e);

  if (mode === 'fill') {
    saveHistory();
    floodFill(Math.round(pos.x), Math.round(pos.y), hexToRgba(currentColor));
    return;
  }

  saveHistory();
  drawing = true;
  lastX = pos.x; lastY = pos.y;

  ctx.beginPath();
  ctx.arc(lastX, lastY, (mode==='eraser' ? brushSize*1.5 : brushSize)/2, 0, Math.PI*2);
  if (mode === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = currentColor;
  }
  ctx.fill();
}

function onMove(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(pos.x, pos.y);
  ctx.lineWidth = mode==='eraser' ? brushSize*1.5 : brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (mode === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = currentColor;
  }
  ctx.stroke();
  lastX = pos.x; lastY = pos.y;
}

function onEnd() {
  if (drawing) {
    drawing = false;
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ─── UNDO ───
document.getElementById('btn-undo').onclick = () => {
  if (drawHistory.length > 0) {
    const snap = history.pop();
    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    if (history.length > 0) ctx.putImageData(history[history.length-1], 0, 0);
    else ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  }
};

document.getElementById('btn-clear').onclick = () => {
  if (!confirm('Clear all drawing?')) return;
  saveHistory();
  ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
};

// ─── FLOOD FILL ───
function hexToRgba(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b,255];
}

function colorsMatch(a, b, tol=40) {
  return Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]) + Math.abs(a[3]-b[3]) < tol*4;
}

function floodFill(startX, startY, fillColor) {
  const dpr = window.devicePixelRatio || 1;
  const w = drawCanvas.width, h = drawCanvas.height;
  
  // We need to fill considering BOTH the draw canvas AND bg
  // Get bg pixels from a temp canvas
  const tmpC = document.createElement('canvas');
  tmpC.width = w; tmpC.height = h;
  const tmpCtx = tmpC.getContext('2d');
  // draw bg
  tmpCtx.drawImage(bgImg, 0, 0, w, h);
  // draw current drawing on top
  tmpCtx.putImageData(ctx.getImageData(0,0,w,h), 0, 0);
  const imgData = tmpCtx.getImageData(0, 0, w, h);
  const data = imgData.data;
  
  const sx = Math.round(startX * dpr);
  const sy = Math.round(startY * dpr);
  if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;

  const idx = (sy * w + sx) * 4;
  const targetColor = [data[idx], data[idx+1], data[idx+2], data[idx+3]];
  
  if (colorsMatch(targetColor, fillColor, 10)) return;

  // Apply fill only to drawCanvas
  const drawData = ctx.getImageData(0, 0, w, h);
  const dd = drawData.data;

  const stack = [sx, sy];
  const visited = new Uint8Array(w * h);

  while (stack.length > 0) {
    const cy = stack.pop();
    const cx = stack.pop();
    if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
    const i = cy * w + cx;
    if (visited[i]) continue;
    visited[i] = 1;
    const pi = i * 4;
    const pColor = [data[pi], data[pi+1], data[pi+2], data[pi+3]];
    if (!colorsMatch(pColor, targetColor)) continue;
    dd[pi] = fillColor[0]; dd[pi+1] = fillColor[1]; dd[pi+2] = fillColor[2]; dd[pi+3] = 255;
    stack.push(cx+1, cy, cx-1, cy, cx, cy+1, cx, cy-1);
  }
  ctx.putImageData(drawData, 0, 0);
}

// ─── TEXT FIELDS ───
const FIELDS = [
  ['name', 'your name', 8.5, 10.2, 21, 14, 'center', false],
  ['hair', '____', 41, 14.8, 16, 13, 'center', false],
  // ... etc
];const textLayer = document.getElementById('text-layer');

function positionFields() {
  const rect = bgImg.getBoundingClientRect();
  const wrapRect = wsWrap.getBoundingClientRect();
  const scaleX = rect.width / IMG_W;
  const scaleY = rect.height / IMG_H;
  
  // Remove existing inputs
  textLayer.innerHTML = '';
  
  FIELDS.forEach(([id, placeholder, xPct, yPct, wPct, fs, align, multi]) => {
    const wrap = document.createElement('div');
    wrap.className = 'field-wrap';
    const x = (xPct / 100) * rect.width;
    const y = (yPct / 100) * rect.height;
    const w = (wPct / 100) * rect.width;
    const scaledFs = Math.round(fs * scaleX * 1.5);
    wrap.style.left = x + 'px';
    wrap.style.top = y + 'px';
    wrap.style.width = w + 'px';

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.id = 'field-' + id;
    inp.placeholder = placeholder;
    inp.style.fontSize = scaledFs + 'px';
    inp.style.textAlign = align;
    wrap.appendChild(inp);
    textLayer.appendChild(wrap);
  });
}

bgImg.addEventListener('load', positionFields);
if (bgImg.complete) positionFields();
window.addEventListener('resize', positionFields);

// ─── EXPORT ───
document.getElementById('btn-export').onclick = async () => {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  
  await new Promise(r => setTimeout(r, 50));

  const dpr = window.devicePixelRatio || 1;
  const exportW = IMG_W;
  const exportH = IMG_H;

  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = exportW;
  exportCanvas.height = exportH;
  const ectx = exportCanvas.getContext('2d');

  // 1. Draw white background
  ectx.fillStyle = '#ffffff';
  ectx.fillRect(0, 0, exportW, exportH);

  // 2. Draw the bg worksheet image
  ectx.drawImage(bgImg, 0, 0, exportW, exportH);

  // 3. Draw user's coloring (scaled from draw canvas)
  const drawTmp = document.createElement('canvas');
  drawTmp.width = exportW;
  drawTmp.height = exportH;
  const dtctx = drawTmp.getContext('2d');
  // The draw canvas has dpr scaling — draw it scaled down to export size
  dtctx.drawImage(drawCanvas, 0, 0, drawCanvas.width, drawCanvas.height, 0, 0, exportW, exportH);
  ectx.drawImage(drawTmp, 0, 0);

  // 4. Draw the black line art on top
  const linesImg = document.getElementById('lines-img');
  ectx.drawImage(linesImg, 0, 0, exportW, exportH);

  // 5. Draw text fields
  const scaleX = exportW / bgImg.offsetWidth;
  const scaleY = exportH / bgImg.offsetHeight;
  
  FIELDS.forEach(([id, placeholder, xPct, yPct, wPct, fs, align]) => {
    const inp = document.getElementById('field-' + id);
    if (!inp || !inp.value) return;
    const x = (xPct / 100) * exportW;
    const y = (yPct / 100) * exportH;
    const w = (wPct / 100) * exportW;
    const scaledFs = Math.round(fs * scaleX * 1.5);
    
    ectx.save();
    ectx.font = `${scaledFs}px 'Comic Sans MS', 'Comic Sans', cursive`;
    ectx.fillStyle = '#1a1a8a';
    ectx.textAlign = align;
    ectx.textBaseline = 'middle';
    const textX = align === 'center' ? x + w/2 : x;
    ectx.fillText(inp.value, textX, y + scaledFs * 0.6, w);
    ectx.restore();
  });

  // 6. Download
  exportCanvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = 'all-about-me.png';
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');

  setTimeout(() => toast.classList.remove('show'), 2000);
};
</script>
